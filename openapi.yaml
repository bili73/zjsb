  /export:
    post:
      tags:
      - export
      summary: 所选结果必填齐全且识别异议处理后导出XLSX
      description: batch_id与task_ids二选一，versions须精确覆盖整个选择；任一无保存结果、必填缺值或明确异议未处理则409 EXPORT_BLOCKED且整次阻止。仅operator/admin可导出，无额外理由；NEED_REVIEW/FAILED已有结果、必填齐全且无未处理明确异议也可导出，明确的格式/校验失败和识别冲突增加导出门禁，但不改识别状态；未标定置信度、未联网核验和规则未覆盖仅提示。人员包第一张人员信息总表一包一行，包含所选材料类型的全部业务字段（含选填与空值），类型前缀区分同名字段，同类多份编号分组并附来源文件；体检总表保留全部17个profile字段及异常指标，户口成员和通用正文/键值完整保留。后附分类明细。普通批次格式不变。证件输出已保存业务字段；体检明细为单个18列审核记录台账，每报告一行，大项数量为本次体检项目意义清单count，异常原名/结果/诊断汇总一格；身高/体重记录测量而不计异常，小结不算项目，BMI保留，不默认正常、不自动分级/录取。内部状态、UUID和详情留在应用。
      requestBody:
