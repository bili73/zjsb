openapi: 3.0.3
info:
  title: 证件关键信息提取系统 API
  version: 1.26.0
  description: |
    内部证件信息提取系统 API 契约（SPEC v1.28）。
    批次按不可变上传账号ID隔离：管理员查看全部，operator/viewer仅能访问自己的批次和所属任务。列表先过滤归属再计算总数和分页，越权ID与不存在ID统一404；结果、原图、复核、取消、重跑、完整字段及导出同样校验。混合账号导出整次拒绝，不输出部分结果。删除批次仍仅管理员可操作。
    Batch.owner返回上传人署名；姓名使用当前账号信息，删除登录前保留加密署名快照。历史创建记录完整且操作者唯一才回填归属，无法关联账号的记录仅管理员可见，同名重建不继承。管理员可编辑显示姓名，不修改账号名、角色、密码、启用状态或会话。
    Task.progress_detail提供真实页/区域处理计数；总计划未知时返回null，不估算推理长度或剩余时间。progress保留兼容但不再作为整体进度依据。
    管理员支持创建、启用/禁用、删除其他账号及重置密码；所有角色可凭原密码修改自己的密码。删除保留历史任务，禁用及改密撤销全部会话；保护当前账号和最后一个启用的管理员。
    业务路由默认要求登录，并独立校验角色及批次归属。写入在同一数据库事务内复验有效会话及权限；预览、Excel和自动分类等耗时处理完成后再复验，不向已撤销会话返回内容。撤销不回滚此前已合法提交的操作或召回已发送的数据。登录和静态网页公开；根路径GET /health仅返回status，完整引擎状态在本API的GET /health且要求登录。
    六类检查包含肝功，优先汇总明确异常；无小结时按有来源的正常检测明细汇总为“已识别明细未见异常”，不宣称整组完整。明确原文正常结论和人工值保持不变；报告A级可作摘要依据，不覆盖阳性、异常或矛盾，也不修改检测行分类/复核。
    明细缺失或未知不默认正常；完整有序且已闭合的原生PDF项目意义表可证明未载明，使用value=null/absence_reason=NOT_ON_DOCUMENT、derived和项目来源，页面/医疗Excel显示报告未载明。保留人工优先、历史密文与既有复核要求。

    当前实现11种材料目录、受控上传、批次/任务查询、人工补正、完整原件预览、字段reveal及XLSX导出。
    管理员可永久删除全部任务已停止的批次（包括NEED_REVIEW），同时清理关联文件与历史结果并保留审计；排队/运行中禁止删除，需提交完整任务版本快照。
    银行卡支持整张照片自动识别，失败逐张裁图重识别或补录；不接收PDF，不声称通用CVV自动检测可靠。
    护照、身份证、执照与户口本暂无真实样本准确率验收；本地校验PASS不等于官方真实性。
    当前列表支持分页和UTC+8创建日期范围过滤，不支持关键词/状态过滤；重跑只接受run_id及expected_revision并沿用类型/选项。
    人员材料包支持一次选齐多种材料，以file_types按文件顺序指定类型；普通类型批次仍用doc_type_hint。自动分类仅提供可修改的建议，不判断人员归属。追加绑定package_revision；不按姓名自动合并，不转换历史批次。身份证配套仅检查同包两面材料存在，不证明同一人或真实性，不改变必填导出条件。
    未经标定置信度保持null；人工补正后仍须解决必填、冲突和覆盖问题才可COMPLETED。导出独立检查已保存结果必填有值且没有未处理的明确异议，不更改审核或识别状态。
    x-implemented:false路径为后续目标；公开路径保持/api/v1。所有原始执行与证据不可被人工版本覆盖。

    面向每日约50文件、每台人资电脑独立本地部署，仅绑定loopback，无内网推理服务器依赖；接口不绑定数据库、任务队列或Web框架，实现建议见ARCHITECTURE.md。
    首版使用现有Batch/Task GET接口轮询；SSE后置，v1.9不提供/events/stream。
    默认dual_resident：GLM/Paddle加载和预热串行，成功双驻留后各有独立FIFO队列，同一模型最多一个请求，跨模型允许并发识别；单驻留或启动降级保持串行，故障并发模型不自动重载。
    模型依赖错误不误判内存不足，降级不改写已保存配置，不因轮询或新任务重复尝试双驻留；CPU-only与16GB未知GPU机器未验证可用。

    重要约定：
    - 上传、重跑等处理为**异步**，返回 202；查询和人工复核为同步接口
    - 一个文件对应一个 Task，PDF 的页面存于 pages[]；一文件混装无关证件时置NEED_REVIEW并提示分别上传，首版不增加Document数组
    - 所有 PDF 优先使用可靠文字层，仅图像或不可靠区域进行 OCR
    - 置信度与 need_review 由**后端**计算，只有经标定的 confidence 才可非 null；不可用时不得填固定分数
    - 登录鉴权后默认完整显示业务字段、证据原文、候选、通用全文及复核回显；完整原图与XLSX仍限operator/admin。内部密钥、私有历史和安全码不进入响应
    - 文件入库前必须不可恢复遮盖 CVV；不持久化带 CVV 的原图、OCR 输出或缓存，任何响应与导出均禁止 CVV
    - 无法确认CVV已清理时拒绝保存并要求提供已遮盖文件；含敏感原值的历史审计按管理员业务保留设置保存（初始7天），到期清理，仅保留脱敏审计
    - 所有材料类型采用相同的鉴权后完整显示策略；此策略不解除CVV禁存、受控存储及访问鉴权
    - **单一入口**：仅网页人工上传，不提供自动接入入口；Batch/Task 不含接入来源 source，Field.source 保留为字段证据定位
    - **`XUEXIN_DIPLOMA_TABLE` 仅支持《教育部学历证书电子注册备案表》一种**，可靠 PDF 文字层优先，扫描或不可靠区域回退 OCR；
      在线验证码去空白后 12/16 位 ASCII 字母数字仅作本地兼容候选规则；未确认版本按 UNKNOWN 待核对；其他学信网报告（学籍/学位在线验证报告、学历/学位认证报告）
      一律 `report_kind=OTHER_REPORT` 并 `NEED_REVIEW`，不抽取字段
    - 本版不接入自动学信网联网验证；metadata默认manual_verify_status=NOT_CHECKED，人工在线状态写入接口尚未实现
    - 写操作在同一事务校验 run_id 与 expected_revision；不匹配返回 409 RESULT_VERSION_CONFLICT，禁止覆盖新执行结果
    - 同步 400/422 仅表示请求或 schema/编辑校验错误；接受任务后的 OCR、模型或抽取问题写入 Task.error、review_issues 或 warnings
    - worker中断恢复确认旧执行停止后，QUEUED有取消请求则CANCELLED，否则继续排队；执行中run有取消请求则CANCELLED，否则FAILED且error.code=WORKER_INTERRUPTED；不新增Task状态
    - 管理员可按材料类型统一设置必填字段；当前及历史任务读取、补填和导出使用最新设置，不重跑OCR或改写人工值
  license:
    name: Internal
servers:
  - url: http://127.0.0.1:8765/api/v1
    description: 本机loopback服务（开发及本地部署）
  - url: /api/v1
    description: 本机loopback服务同域部署

tags:
  - name: system
    description: 系统与健康检查
  - name: meta
    description: 元数据（字段字典）
  - name: batches
    description: 批次
  - name: tasks
    description: 任务
  - name: export
    description: 导出

security:
  - SessionAuth: []
  - ApiKeyAuth: []

paths:
  /auth/me/workbench:
    get:
      tags: [system]
      summary: 读取当前登录账号的卡片布局
      description: 仅命名账号会话可用。归属由会话确定；所有角色只能读取自己的布局，管理员没有他人布局入口。个人layout为null表示继承defaults，defaults.layout为null表示系统初始排列；空数组表示全部收纳。
      responses:
        '200':
          description: 当前账号布局与版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchPreferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      tags: [system]
      summary: 保存当前账号的卡片布局
      description: 仅命名账号会话可用，所有角色可修改自己的布局。事务内复验登录状态，校验当前revision；重复或不支持的类型拒绝。相同布局不递增版本；恢复默认保留版本以拒绝过期写入。删除账号同时删除布局，同名重建不继承。不导入旧浏览器共享配置。
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [layout, expected_revision]
              properties:
                layout: {$ref: '#/components/schemas/WorkbenchEntries'}
                expected_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
      responses:
        '200':
          description: 保存后的布局与版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchPreferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/workbench-default:
    put:
      tags: [system]
      summary: 管理员设置公共默认卡片布局
      description: 仅管理员，事务内复验会话和角色，Origin/CSRF保护。只改变未自定义账号读取时继承的默认布局，不改写任何个人布局。null恢复系统初始排列，[]表示全部收纳。expected_revision对应defaults.revision；冲突返回WORKBENCH_DEFAULT_VERSION_CONFLICT，不能自动重试。
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [layout, expected_revision]
              properties:
                layout: {$ref: '#/components/schemas/WorkbenchEntries'}
                expected_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
      responses:
        '200':
          description: 已保存的公共默认布局与版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkbenchLayout'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/retention:
    get:
      tags: [system]
      summary: 管理员读取全局文件保留设置及超期数量
      responses:
        '200':
          description: 影响数量仅为assessed_at时的快照，活动文件延后清理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetentionSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [system]
      summary: 管理员确认并保存文件保留时长
      description: 对所有账号新旧文件统一生效，按每份文件原上传时间计算。前端每次保存前弹窗说明影响和超期数量，取消不发送请求。事务内重新验证管理员会话并核对expected_revision；冲突409 RETENTION_VERSION_CONFLICT，不能自动重试。原子保存设置和有限到期时间，不改识别结果、人工值或结果版本；保存本身不删除文件，下次启动或空闲周期清理。null为永不自动清除，仍可手动删除；已清理数据不会恢复。无变化不递增版本，仍需权限和confirmed校验。
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days, expected_revision, confirmed]
              properties:
                days: {type: integer, nullable: true, enum: [7, 15, 30, null]}
                expected_revision: {type: integer, minimum: 0}
                confirmed: {type: boolean, enum: [true]}
      responses:
        '200':
          description: 已保存的设置及最新数量快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetentionSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/required-fields:
    get:
      tags: [system]
      summary: 管理员读取共享必填字段设置
      responses:
        '200':
          description: 所有材料的当前有效字段及全局设置版本
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequiredFieldSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [system]
      summary: 管理员保存一种材料的共享必填字段设置
      description: 同源Origin及X-CSRF-Token验证，正文最多8192字节。required_fields数组为该类型精确必填集合，空数组允许所有业务字段选填；null恢复默认及条件必填。派生只读字段不可设必填。更新影响所有账号和历史任务，但不改写结果密文、人工值、任务状态或结果版本。expected_revision匹配全局设置版本；过期返回409 SETTINGS_VERSION_CONFLICT，不自动重放。未变更不递增版本。
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequiredFieldSave'}
      responses:
        '200':
          description: 保存后的全部有效设置
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequiredFieldSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/users:
    get:
      tags: [system]
      summary: 管理员查询账号
      description: 仅admin可调用。返回按账号名排序的公共账号信息，不包含密码、摘要或会话；operator/viewer返回403。
      responses:
        '200':
          description: 公共账号列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ManagedUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [system]
      summary: 管理员创建账号
      description: 仅admin可调用，同源Origin及X-CSRF-Token验证；请求体最多8192字节。账号名不区分大小写，以小写保存，默认角色operator。大小写等价的重复账号返回409 USERNAME_EXISTS，不覆盖原密码、角色、启用状态或会话。
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: 账号已创建，可以登录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/users/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
      - in: header
        name: X-CSRF-Token
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    patch:
      tags: [system]
      security: [{SessionAuth: []}]
      summary: 管理员修改账号姓名或启用状态
      description: 同源Origin；正文最多8192字节，每次只接受display_name或enabled其中一种。姓名去除首尾空白，需1至80个可打印字符；允许修改自己的姓名，不改变登录账号名、角色、密码、启用状态、会话和批次归属，批次署名在下一次读取时更新。禁用和会话撤销同一事务提交，启用不会恢复旧会话。不允许禁用自己或最后一个启用的管理员（409 ACCOUNT_PROTECTED）；目标不存在404。事务内重新核验操作者的有效会话与admin权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200':
          description: 更新后的公共账号信息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    delete:
      tags: [system]
      security: [{SessionAuth: []}]
      summary: 管理员删除其他登录账号
      description: 同源Origin。只删除账号及会话，保留任务、识别结果及审计中的原操作者UUID；同名重建使用新UUID。不允许删除自己或最后一个启用的管理员（409 ACCOUNT_PROTECTED）。目标不存在404；事务内重新核验有效会话与admin权限。无需请求体。
      responses:
        '204': {description: 账号及其会话已删除，历史记录保留}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /admin/users/{user_id}/password:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: {type: string, format: uuid}
      - in: header
        name: X-CSRF-Token
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    post:
      tags: [system]
      security: [{SessionAuth: []}]
      summary: 管理员重置其他账号的密码
      description: 同源Origin；正文最多8192字节。只更新密码摘要并撤销目标全部会话；禁用的账号不会隐式启用。不允许用此入口重置自己（409 ACCOUNT_PROTECTED），应使用auth/password。目标不存在404；哈希后在事务内重新核验有效会话与admin权限，不返回或记录密码。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: 密码已重置，所有旧登录已失效}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /auth/password:
    post:
      tags: [system]
      security: [{SessionAuth: []}]
      summary: 当前用户凭原密码修改自己的密码
      description: 所有角色均可使用，同源Origin及X-CSRF-Token；正文最多8192字节。原密码不正确返回422 CURRENT_PASSWORD_INCORRECT，保留当前登录。成功修改密码与撤销全部会话原子提交，并清除请求浏览器Cookie，必须重新登录。并发重置使旧会话失效时返回401，不覆盖新密码。
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: 密码已修改，全部会话撤销且Cookie已清除}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /auth/login:
    post:
      tags: [system]
      summary: 账号密码登录
      security: []
      description: 仅同源Origin接受登录，JSON正文最多8192字节；每个直接客户端地址五分钟内最多五次尝试，下一次返回429。无默认账号，部署时用本地管理命令创建。成功设置host-only、HttpOnly、SameSite=Strict的ocr_session，HTTPS增加Secure，仅当前loopback HTTP开发模式可省略Secure。新登录成功后原子撤销同一账号全部旧会话，数据库保证每账号仅一个浏览器会话；同浏览器多标签共享，其他浏览器/配置文件也视为新设备；不返回密码或Cookie令牌正文。会话绝对有效期30天，不因轮询续期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 64}
                password: {type: string, minLength: 1, maxLength: 128, format: password}
      responses:
        '200':
          description: 登录成功并设置会话Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
  /auth/logout:
    post:
      tags: [system]
      summary: 退出并撤销当前服务端会话
      description: Cookie认证必须同源Origin及X-CSRF-Token，令牌由登录或auth/me响应提供。撤销服务端当前会话并清除Cookie；密码重置或停用账号会撤销该用户的全部会话，任务仍独立继续运行。
      responses:
        '204': {description: 已退出}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /health:
    get:
      tags: [system]
      summary: 登录后完整健康检查
      description: 此路径相对于/api/v1，要求有效登录。检查数据库、独立worker与存储可用性；任一不可用时status=degraded。worker可响应调度但模型尚未加载不等于down；status=ok不代表所有OCR模型可用。可选runtime独立展示启动及驻留能力，缺失不默认ready。不得泄露路径、PID、异常全文、密钥或文件信息。另有根路径GET /health公开仅返回status。
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, queue_depth, components]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version: {type: string, description: 应用版本, example: "1.12.0"}
                  queue_depth: {type: integer, minimum: 0, nullable: true, example: 3, description: 等待执行且未请求取消的QUEUED任务数；数据库不可查询时为null，不伪造0}
                  components:
                    type: object
                    required: [db, worker, storage]
                    properties:
                      db: {type: string, enum: [ok, down]}
                      worker: {type: string, enum: [ok, down], description: 当前worker进程可响应并调度任务；不要求模型已加载或全部模型可用}
                      storage: {type: string, enum: [ok, down]}
                  runtime:
                    type: object
                    additionalProperties: false
                    required: [configured_mode, effective_mode, state, models, reason_code]
                    description: 可选运行时快照；仅展示能力，不是模型管理接口。自动降级仅影响当前会话，单驻留的unloaded模型可按需加载，failed模型不得因轮询或新任务反复重试。
                    properties:
                      configured_mode:
                        type: string
                        enum: [dual_resident, single_resident]
                        default: dual_resident
                        description: 保存的部署模式；自动降级不改写此值。
                      effective_mode:
                        type: string
                        nullable: true
                        enum: [dual_resident, single_resident, ocr_unavailable, null]
                        description: 当前有效模式；启动尚未确定时为null。single_resident仅承诺最多一个模型驻留，具体模型能力见models；全部OCR模型不可用时为ocr_unavailable，不暗示CPU回退可用。
                      state:
                        type: string
                        enum: [starting, ready, degraded, stopping]
                        description: starting表示启动未稳定；ready表示配置模式已可用；自动降级、模型失败或OCR不可用为degraded；退出为stopping。与组件健康status独立。
                      models:
                        type: object
                        additionalProperties: false
                        required: [glm_ocr, paddleocr_vl]
                        description: ready表示该模型已加载预热且可被调度，不代表当前空闲或允许并发执行；unloaded不等于failed。
                        properties:
                          glm_ocr: {type: string, enum: [unloaded, loading, warming, ready, failed, stopping]}
                          paddleocr_vl: {type: string, enum: [unloaded, loading, warming, ready, failed, stopping]}
                      reason_code:
                        type: string
                        nullable: true
                        enum: [RESOURCE_LIMIT, MODEL_LOAD_FAILED, MODEL_WARMUP_FAILED, MODEL_PROCESS_EXITED, SUPERVISION_FAILED, null]
                        description: 降级或失败的主原因；正常启动/运行/退出为null。OOM或明确资源不足为RESOURCE_LIMIT，其他加载/预热错误不得误报资源不足；不返回原始异常。

  /auth/me:
    get:
      tags:
      - system
      summary: 当前用户与权限
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  display_name:
                    type: string
                  role:
                    type: string
                    enum:
                    - viewer
                    - operator
                    - admin
                  permissions:
                    type: array
                    items:
                      type: string
                      enum:
                      - review
                      - reveal
                      - rerun
                      - export
                  csrf_token:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                    description: Cookie会话返回；仅保留在页面内存，unsafe请求附X-CSRF-Token，不是会话Cookie令牌
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: viewer的permissions为空数组；operator/admin返回rerun、review、reveal、export。默认完整值显示不改变写操作及原图/XLSX的角色权限。

  /doc-types:
    get:
      tags:
      - meta
      summary: 证件类型与字段字典
      description: '前端**必须**基于此接口动态渲染复核表单，**禁止硬编码字段字典**。

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocTypeMeta'

  /batches:
    get:
      tags:
      - batches
      summary: 批次列表
      description: 任务批次支持按日/周/月分组及对应日期选择器，固定UTC+8，周为周一至周日，组内创建时间降序。首次默认今天，日/周/月显示所选日期所在范围；新上传回到今天所在范围。清空或点击全部日期才跨日期浏览。GET /batches可选date_from/date_to（YYYY-MM-DD，含首尾当地日期），先按UTC+8日期过滤全部历史再统计和分页；错误/倒序范围返回422。不改UTC存储时间。切换范围丢弃迟到列表响应，不清除隐藏批次的在途任务或识别结果；后台任务轮询继续。
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - PARTIAL
          - FAILED
          - CANCELLED
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: keyword
        in: query
        description: 按批次显示名或文件名模糊搜索
        schema:
          type: string
      - name: date_from
        in: query
        schema: {type: string, format: date}
        description: UTC+8当地日期，包含当日；可单独提供
      - name: date_to
        in: query
        schema: {type: string, format: date}
        description: UTC+8当地日期，包含当日；不得早于date_from
      responses:
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
    post:
      tags:
      - batches
      summary: 创建批次（人工上传）
      description: 银行卡直接上传单张JPG/PNG/HEIC照片（可为整张正面或卡号裁图），PDF不支持。上传只做解码与大小检查，不调用模型；每张图片入独立Task，后台默认GLM识别并按现有规则提取卡号、离线匹配银行。卡号缺失、冲突或格式失败时，结果页可只裁这张重识别或手工补录；置信度未知/BIN未覆盖不强迫裁剪。裁图可左右90°旋转，使用真实旋转像素，作为新任务提交；原任务及其他卡片保留。裁图上传失败保留已生成文件，检查任务列表后可直接重试。整图现会加密保存在服务端，原文/尝试可能包含卡面其他内容；不新增安全码字段或导出列，仍拒绝检测到的明确CVV等文本，但不承诺通用安全码检测。 单批1–100文件、单文件50MB、总计500MB，MB按1024×1024字节计算，包含上限，超限返回FILE_TOO_LARGE/413，拒绝整批且不创建部分任务。一文件一Task；同批重复内容复用任务。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              oneOf:
              - required: [doc_type_hint]
              - required: [file_types]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                    description: 非空文件，最多50MB（50×1024×1024字节）；整批文件内容最多500MB。
                doc_type_hint:
                  $ref: '#/components/schemas/DocTypeEnum'
                file_types:
                  type: string
                  maxLength: 4096
                  description: JSON数组字符串，按files顺序为每份指定一种DocTypeEnum（TABLE除外，表格须独立入口）；长度必须相同，不能同时传doc_type_hint。创建人员材料包，无需预填person_name，识别后提供姓名建议。不按文件名绑定，重名文件不会互相覆盖。先校验全部文件，再在一个事务内提交。
                person_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: 可选，兼容预先人工确认姓名；未提供时识别后通过person接口确认。创建独立人员材料包，不按同名合并；存储加密，不能在追加请求中更改。
                abnormal_only:
                  type: boolean
                  default: false
                  description: 仅对 MEDICAL_REPORT 生效；完整抽取后投影异常/未知项，不减少原始结果或 stats
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  task_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /classify:
    post:
      tags: [batches]
      summary: 建议单份材料类型（不创建任务）
      description: operator/admin权限及会话CSRF校验。仅内存读取一个文件；PDF只检查前两页，优先文字层，图片用固定版本RapidOCR的CPU模型。全服务同时最多一份分类，不占GLM/Paddle队列；繁忙、OCR不可用或内容不明确时返回可手动选择的建议。内容优先于文件名提示，不返回识别正文、人员姓名或编号，不持久化原件与分类结果，不判断人员归属。最多50MB、4000万像素；PDF沿用上传解码限制。文件名不明确的身份证不能推定正反面，未知内容不自动分到通用识别。建议总可修改，不是准确率保证。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: {type: string, format: binary}
      responses:
        '200':
          description: 分类建议或待选择
          content:
            application/json:
              schema:
                type: object
                required: [doc_type, basis, reason, candidates]
                properties:
                  doc_type: {type: string, nullable: true, description: 支持的DocTypeEnum或null；null须手动选择}
                  basis: {type: string, enum: [content, filename, unknown]}
                  reason: {type: string, maxLength: 200}
                  candidates:
                    type: array
                    items: {$ref: '#/components/schemas/DocTypeEnum'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '413': {$ref: '#/components/responses/ErrorResponse'}
        '415': {$ref: '#/components/responses/ErrorResponse'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}

  /batches/{batch_id}:
    parameters:
    - $ref: '#/components/parameters/BatchId'
    get:
      tags:
      - batches
      summary: 批次详情及人员材料包的身份证配套提示
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - batches
      summary: 删除批次及其所有任务
      description: 仅admin且事务内重新核验有效会话与权限。同源Origin/CSRF。仅当所有任务均为NEED_REVIEW/COMPLETED/FAILED/REJECTED/CANCELLED时允许；排队或运行中返回409 INVALID_STATE。versions必须覆盖批次全部任务且run_id/expected_revision匹配，否则409 RESULT_VERSION_CONFLICT；重复版本或无效请求422。事务删除任务、所有运行/尝试/原文件/页面及修正访问历史的元数据，保留不含原始业务值的审计；提交后清理专属加密文件。cleanup_pending=true表示记录已删除但部分文件未清理，已记录诊断，服务下次启动沿用孤立文件清理补清；不自动重试删除。不删除外部原始素材、其他批次、已下载Excel、日志或备份。重复删除返回404。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchDeleteRequest'}
      responses:
        '200':
          description: 业务记录已删除；检查cleanup_pending确认物理文件清理是否完成
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchDeleteResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /batches/{batch_id}/tasks:
    parameters: [{$ref: '#/components/parameters/BatchId'}]
    get:
      tags: [batches]
      summary: 批次下的任务列表
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TaskStatus'}
        - name: doc_type
          in: query
          schema: {$ref: '#/components/schemas/DocTypeEnum'}
      responses:
        '404': {$ref: '#/components/responses/NotFound'}
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Task'}

  /batches/{batch_id}/append:
    parameters:
    - $ref: '#/components/parameters/BatchId'
    post:
      tags:
      - batches
      summary: 向已有批次补充上传文件
      description: 向is_person_package为true的材料包追加，姓名待确认也可操作。operator仅自己的包，admin可操作全部，viewer不可写；写事务内再次核验会话与归属。file_types支持一次补交多种材料，按files顺序绑定；doc_type_hint兼容单类型，两者不能同时提交。不按姓名自动关联。expected_revision必须匹配package_revision，否则409 RESULT_VERSION_CONFLICT。新任务独立排队，旧任务/结果/到期时间不变；新任务自追加日起按管理员保留设置计算期限。相同文件同类型复用原任务，返回的新task_ids可为空；相同文件不同类型返回422。整次校验/写入原子失败，容量限制同首次上传。人员名称不可在此更改。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              - expected_revision
              oneOf:
              - required: [doc_type_hint]
              - required: [file_types]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                    description: 非空文件，最多50MB（50×1024×1024字节）；本次文件内容最多500MB。
                doc_type_hint:
                  $ref: '#/components/schemas/DocTypeEnum'
                expected_revision:
                  type: integer
                  minimum: 0
                  description: 当前材料包的package_revision；multipart中为非负十进制文本。
                file_types:
                  type: string
                  maxLength: 4096
                  description: JSON数组字符串，按files顺序指定每份材料类型（TABLE除外）；长度须相同。与doc_type_hint二选一。人员归属继承现有材料包。
                abnormal_only:
                  type: boolean
                  default: false
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: {type: string, format: uuid}
                  task_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
      x-implemented: true

  /batches/{batch_id}/person:
    patch:
      tags: [batches]
      summary: 确认或修改人员材料包姓名
      description: 仅operator自己的包或admin任意包；viewer不可写。姓名去首尾空白后为1至80个可打印字符，加密保存。事务内重新核验会话及归属；expected_revision匹配package_revision后递增，与追加共享版本。只修改包标签，不改识别结果、文件、归属和到期时间；后续识别不会覆盖。不提供自动人员合并。
      parameters:
      - name: batch_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonNameRequest'}
      responses:
        '200':
          description: 姓名已保存，返回最新材料包
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
