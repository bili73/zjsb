          description: 业务材料为XLSX；TABLE单任务为XLSX，多任务为ZIP；不能混合TABLE与其他类型。表格标题选填，有效矩阵且表头明确可直接导出，无需首次保存；不完整结果须明确确认。全部内容按文本写入。
          headers:
            Content-Disposition:
              schema: {type: string}
              description: UTF-8 filename*；单表标题优先，无标题用原图片名去扩展名，原名不可用用表格_北京时间YYYYMMDD_HHMMSS，多表为ZIP且重名加序号。人工标题含主动清空均优先，否则按既有排名采用首个有效候选。完整表格无需先保存，修改后须保存；标题空缺不阻止导出，表头缺失或结构不完整仍阻止整次导出。
          content:
            application/zip:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:

  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: ocr_session
      description: 正常浏览器身份；Cookie认证的所有非GET/HEAD/OPTIONS请求同时要求同源Origin与X-CSRF-Token。每次校验服务端有效会话和未停用账号。
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 仅尚未创建任何web_users账号的旧本机CLI兼容；创建过账号后永久关闭该认证入口，浏览器不再使用Key。当前loopback/Host边界未放宽，远程部署另行资格验证。

  parameters:
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ErrorResponse:
      description: 同步业务错误；409 区分 INVALID_STATE 与 RESULT_VERSION_CONFLICT，异步识别错误由 Task.error 返回
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: 请求 schema 或复核编辑无效（未知ID、冲突操作、不可确认问题等）；不用于 PDF 无文字层等异步处理告警
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    WorkbenchPreferences:
      type: object
      additionalProperties: false
      required: [layout, revision, defaults]
      properties:
        layout: {$ref: '#/components/schemas/WorkbenchEntries'}
        revision: {type: integer, minimum: 0}
        defaults: {$ref: '#/components/schemas/WorkbenchLayout'}
    WorkbenchEntries:
      type: [array, 'null']
      maxItems: 13
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 64}
    WorkbenchLayout:
      type: object
      additionalProperties: false
      required: [layout, revision]
      properties:
        layout: {$ref: '#/components/schemas/WorkbenchEntries'}
        revision: {type: integer, minimum: 0}
    RetentionSettings:
      type: object
      additionalProperties: false
      required: [days, revision, impact, assessed_at]
      properties:
        days: {type: integer, nullable: true, enum: [7, 15, 30, null], description: null表示永不自动清除，初始默认7天}
        revision: {type: integer, minimum: 0}
        assessed_at: {type: string, format: date-time}
        impact:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [days, eligible_count, active_count]
            properties:
              days: {type: integer, enum: [7, 15, 30]}
              eligible_count: {type: integer, minimum: 0, description: 此刻已超过期限且不在处理中的文件数}
              active_count: {type: integer, minimum: 0, description: 此刻已超过期限但正在处理的文件数}
    RequiredFieldSettings:
      type: object
      additionalProperties: false
      required: [revision, items]
      properties:
        revision: {type: integer, minimum: 0}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [doc_type, label, uses_defaults, fields]
            properties:
              doc_type: {$ref: '#/components/schemas/DocTypeEnum'}
              label: {type: string}
              uses_defaults: {type: boolean, description: true时保留原默认及条件必填；false时使用精确自定义集合}
              fields:
                type: array
                description: 户口成员以members.key表示，通用正文为generic.full_text；其余使用业务字段key
                items: {$ref: '#/components/schemas/FieldMeta'}
    RequiredFieldSave:
      type: object
      additionalProperties: false
      required: [doc_type, required_fields, expected_revision]
      properties:
        doc_type:
          allOf:
          - {$ref: '#/components/schemas/DocTypeEnum'}
          - not: {enum: [TABLE]}
          description: 照片表格标题选填，使用独立表头与结构校验规则，不支持固定必填字段设置。
        required_fields:
          type: array
          nullable: true
          uniqueItems: true
          items: {type: string}
          description: 可编辑字段key的精确集合；空数组全选填，null恢复默认
        expected_revision: {type: integer, minimum: 0}
    ManagedUser:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, role, enabled]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string, pattern: '^[a-z0-9_.-]{1,64}$'}
        display_name: {type: string, minLength: 1, maxLength: 80}
        role: {type: string, enum: [viewer, operator, admin]}
        enabled: {type: boolean}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, display_name]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$'}
        password: {type: string, minLength: 8, maxLength: 128, writeOnly: true, description: 密码不能全为空白；仅保存Argon2id摘要，不返回或记录原值}
        display_name: {type: string, minLength: 1, maxLength: 80, description: 非空且可打印的显示姓名，首尾空白去除}
        role: {type: string, enum: [viewer, operator, admin], default: operator}
    UpdateUserRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: {type: boolean}
        - type: object
          additionalProperties: false
          required: [display_name]
          properties:
            display_name: {type: string, minLength: 1, maxLength: 80, pattern: '\S', description: 可打印姓名，首尾空白去除；不能全为空白}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password: {type: string, minLength: 8, maxLength: 128, writeOnly: true, format: password, description: 不能全为空白；只保存Argon2id摘要}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 128, writeOnly: true, format: password}
        new_password: {type: string, minLength: 8, maxLength: 128, writeOnly: true, format: password, description: 不能全为空白；只保存Argon2id摘要}
    AuthUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, role, permissions, csrf_token]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        role: {type: string, enum: [viewer, operator, admin]}
        permissions:
          type: array
          items: {type: string}
        csrf_token: {type: string, pattern: '^[0-9a-f]{64}$'}

    Error:
      type: object
      description: 同步请求错误或接受任务后的异步 Task.error；处理阶段错误码不表示上传必须同步失败
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - LOGIN_THROTTLED
            - AUTH_NOT_CONFIGURED
            - USERNAME_EXISTS
            - ACCOUNT_PROTECTED
            - CURRENT_PASSWORD_INCORRECT
            - FILE_TOO_LARGE
            - UNSUPPORTED_FORMAT
            - IMAGE_UNREADABLE
            - DECODE_FAILED
            - NO_DOC_EDGE
            - LOW_QUALITY
            - OVEREXPOSED
            - UNSUPPORTED_DOC_TYPE
            - LUHN_FAILED
            - MULTI_CANDIDATES
            - ID_CHECKSUM_FAILED
            - USCC_CHECKSUM_FAILED
            - XUEXIN_CODE_INVALID
            - MISSING_REQUIRED_FIELD
            - EXTRACT_TIMEOUT
            - REGION_OCR_BUSY
            - REGION_OCR_TIMEOUT
            - REGION_OCR_EMPTY
            - REGION_OCR_UNAVAILABLE
            - WORKER_INTERRUPTED
            - RESULT_VERSION_CONFLICT
            - WORKBENCH_DEFAULT_VERSION_CONFLICT
            - WORKBENCH_VERSION_CONFLICT
            - SETTINGS_VERSION_CONFLICT
            - RETENTION_VERSION_CONFLICT
            - OCR_TOKEN_LIMIT
            - OCR_REPETITION
            - MODEL_CONFLICT
            - BIN_UNKNOWN
            - TASK_NOT_REVIEWABLE
            - FORBIDDEN_REVEAL
            - INVALID_STATE
            - INTERNAL_ERROR
            - CARD_ADMISSION_FAILED
            - UNSAFE_CARD_INPUT
            - EXPORT_BLOCKED
            - EXPORT_VALUE_TOO_LONG
            - PREVIEW_MASK_UNAVAILABLE
        message: {type: string, description: 中文提示，可直接展示}
        detail: {type: string, description: 已脱敏诊断摘要，仅经鉴权的本机客户端可见；不得包含路径、密钥或材料原文}
        details:
          type: object
          description: 仅任务ID、状态、字段键和问题代码等安全阻塞详情，不包含材料原值
          additionalProperties: true
        task_id: {type: string, format: uuid}
        error_id: {type: string, description: 安全诊断编号，用于关联本地日志；不包含材料内容}
        request_id: {type: string, format: uuid, description: 对应X-Request-ID响应头；异步任务错误可以省略}
        stage:
          type: string
          enum: [BOOTSTRAP, QUEUED, PREPROCESSING, OCR, EXTRACTING, VALIDATING, PUBLISHING, CLEANUP]
          description: 出错的处理阶段；未知时省略

    DocTypeEnum:
      type: string
      enum:
      - ID_CARD_FRONT
      - ID_CARD_BACK
      - DIPLOMA
      - DEGREE_CERT
      - BANK_CARD
      - INTERVIEW_FORM
      - MEDICAL_REPORT
      - HOUSEHOLD_REGISTER
      - BUSINESS_LICENSE
      - XUEXIN_DIPLOMA_TABLE
      - GENERIC
      - PASSPORT
      - TABLE

    TaskStatus:
      type: string
      description: COMPLETED/FAILED/REJECTED/CANCELLED 为终态；NEED_REVIEW 为待人工处理的非终态，取消以 worker 停止确认为准
      enum:
        - QUEUED
        - PREPROCESSING
        - OCR
        - EXTRACTING
        - VALIDATING
        - NEED_REVIEW
        - COMPLETED
        - FAILED
        - REJECTED
        - CANCELLED

    BatchStatus:
      type: string
      description: |
        批次初建尚在生成Task时或存在非终态任务（包括NEED_REVIEW）则PROCESSING；全部COMPLETED则COMPLETED；
        全部 CANCELLED 则 CANCELLED；全部 FAILED/REJECTED 或无 COMPLETED 的失败与取消混合则 FAILED；
        有 COMPLETED 且其他任务均为终态则 PARTIAL。按上述顺序聚合。
      enum: [PROCESSING, COMPLETED, PARTIAL, FAILED, CANCELLED]

    Warning:
      type: object
      properties:
        code:
          type: string
          enum:
            - MISSING_ID_BACK
            - MISSING_ID_FRONT
            - MISSING_HOUSEHOLD_PAGE
            - MISSING_MEDICAL_PAGE
            - XUEXIN_DIPLOMA_EXPIRED
            - XUEXIN_TRUNCATED
            - DUPLICATE_FILE
            - PDF_NO_TEXT_LAYER
            - PDF_TEXT_UNRELIABLE
        message: {type: string}
        task_ids:
          type: array
          items: {type: string, format: uuid}

    BatchOwner:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, account_exists]
      oneOf:
        - properties:
            account_exists: {enum: [true]}
            user_id: {type: string}
            username: {type: string}
            display_name: {type: string}
        - properties:
            account_exists: {enum: [false]}
      properties:
        user_id: {type: string, nullable: true, minLength: 1, description: 不可变上传账号ID；历史归属无法确认时null}
        username: {type: string, nullable: true, pattern: '^[a-z0-9_.-]{1,64}$', description: 当前账号名或删除前保留的账号名；无法恢复的历史账号为null}
        display_name: {type: string, nullable: true, minLength: 1, maxLength: 80, description: 当前姓名或删除前保留的姓名；无法恢复时null}
        account_exists: {type: boolean, description: 原账号是否仍存在，禁用账号仍为true；true时ID和账号名及姓名均非null}
    PersonNameSuggestion:
      type: object
      required: [name, sources]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        sources:
          type: array
          minItems: 1
          items:
            type: object
            required: [task_id, doc_type, file_name]
            properties:
              task_id: {type: string, format: uuid}
              doc_type: {$ref: '#/components/schemas/DocTypeEnum'}
              file_name: {type: string}
    PersonNameRequest:
      type: object
      additionalProperties: false
      required: [person_name, expected_revision]
      properties:
        person_name: {type: string, minLength: 1, maxLength: 80}
        expected_revision: {type: integer, minimum: 0}
    Batch:
      type: object
      properties:
        required_fields_revision: {type: integer, minimum: 0, description: 当前共享必填设置版本，与任务结果版本独立}
        batch_id: {type: string, format: uuid}
        owner: {$ref: '#/components/schemas/BatchOwner'}
        person_name: {type: string, nullable: true, minLength: 1, maxLength: 80, description: 人工确认的材料归属；待确认包及普通批次为null；不会被识别自动覆盖，不按同名合并}
        is_person_package: {type: boolean, description: 独立于姓名的材料包标记；既有明确命名的包迁移为true，普通批次为false}
        name_suggestions:
          type: array
          description: 最新保存字段中的姓名建议及来源，不增加模型调用，不证明身份；不从户主、法人或通用正文猜测。不同姓名全部保留。
          items: {$ref: '#/components/schemas/PersonNameSuggestion'}
        package_revision: {type: integer, minimum: 0, description: 姓名确认与追加共享的乐观版本，每次成功写入递增，包括重复文件复用}
        id_card_pairing:
          type: string
          enum: [unassigned, not_provided, missing_front, missing_back, both_present]
          description: unassigned为无人员归属的旧批次；其余只反映本包当前上传类型。missing_back表示可选国徽面未上传，不产生MISSING_ID_BACK告警；人像面可独立识别和导出。both_present仍需人工核对同一人和内容，不等于识别成功或真实性。
        status: {$ref: '#/components/schemas/BatchStatus'}
        display_name:
          type: string
          description: 按批次实际任务的材料类型生成，历史批次同样适用；多类型显示「混合材料 · 类型A / 类型B」，空批次显示「待确定类型」。同类批次通过独立创建时间区分。
          example: "体检报告"
        file_count: {type: integer}
        completed_count: {type: integer}
        need_review_count: {type: integer}
        failed_count: {type: integer}
        cancelled_count: {type: integer}
        rejected_count: {type: integer, description: 与failed_count、cancelled_count按Task状态互斥计数}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true, description: 当前剩余材料中最早的到期时间；追加不会延长旧材料期限}
        finished_at: {type: string, format: date-time, nullable: true}

    BatchList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Batch'}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}

    Task:
      type: object
      description: 一个文件对应一个 Task；PDF 页属于同一任务，不按页创建 Task。身份、执行与结果版本由后端管理。
      required: [task_id, run_id, result_revision, cancel_requested, page_count, pages, status]
      properties:
        required_fields_revision: {type: integer, minimum: 0, description: 本次必填标记所用的共享设置版本}
        export_ready:
          type: boolean
          description: 已保存未筛选结果必填值齐全且无未处理的明确异议时true，与COMPLETED独立；医疗筛选不改变此值，导出不改变审核/识别状态。
        export_blockers:
          type: array
          description: 与export_ready同源的匿名字段路径和代码；MISSING为缺值，DISPUTED为未处理的明确异议，不包含原值。
          items: {$ref: '#/components/schemas/ExportBlocker'}
        task_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid, description: 当前执行ID，重跑/替换/恢复时重新分配}
        result_revision: {type: integer, minimum: 0, description: 任务结果版本，成功写操作原子递增且跨执行单调递增}
        cancel_requested: {type: boolean, description: 已请求取消但不代表worker已停止}
        batch_id: {type: string, format: uuid}
        file_name: {type: string}
        file_size: {type: integer}
        content_hash: {type: string}
        mime_type: {type: string}
        page_count: {type: integer, minimum: 0, description: 文件页数；尚未解析时为0，解析后等于pages数量}
        actual_source_page_count: {type: integer, minimum: 1, nullable: true, description: 上传校验确认的原文件总页数；旧记录可能未知，不从已处理前缀推算}
        pages:
          type: array
          items: {$ref: '#/components/schemas/Page'}
        status: {$ref: '#/components/schemas/TaskStatus'}
        progress:
          type: integer
          minimum: 0
          maximum: 100
          deprecated: true
          description: 兼容旧客户端；新运行准备阶段为0，OCR按已处理区域比例取整且上限99，字段整理阶段不估算百分比。机器正常发布为100，失败/取消保留上次值。历史值可能是固定阶段值，展示优先使用progress_detail；不代表准确率、剩余时间或审核完成。
        progress_detail: {$ref: '#/components/schemas/TaskProgressDetail'}
        doc_type: {$ref: '#/components/schemas/DocTypeEnum'}
        doc_type_confidence: {$ref: '#/components/schemas/Confidence'}
        doc_type_confidence_method: {$ref: '#/components/schemas/ConfidenceMethod'}
        error: {$ref: '#/components/schemas/Error'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
        # 关键摘要，用于列表页展示；历史masked命名字段不作为当前显示来源
        summary:
          type: object
          nullable: true
          properties:
            person_name: {type: string, nullable: true}
            id_number_masked: {type: string, nullable: true}
            card_number_masked: {type: string, nullable: true}
            school_name: {type: string, nullable: true}
            company_name: {type: string, nullable: true, description: 仅 BUSINESS_LICENSE，不脱敏}
            xuexin_kind: {$ref: '#/components/schemas/XuexinKindCheck'}
            xuexin_expired: {type: boolean, nullable: true, description: 仅 XUEXIN_DIPLOMA_TABLE，有效期是否已过}
            abnormal_count: {type: integer, nullable: true, description: 仅 MEDICAL_REPORT}
        need_review_fields:
          type: array
          description: 需复核的字段 key 列表
          items: {type: string}
        extract_options: {$ref: '#/components/schemas/ExtractOptions'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true, description: 本材料独立到期时间，按原上传时间和管理员保留天数计算；null表示永不自动清除}

    TaskProgressDetail:
      type: object
      additionalProperties: false
      required: [stage, prepared_pages, total_pages, processed_regions, recognized_regions, incomplete_regions, total_regions]
      description: 当前run的持久化工作量快照；识别区域耗时不等，区域比例不代表时间进度或识别准确率。原生PDF文字块不计入OCR区域，修复/备用模型不重复计数；精确缓存复用计入目标区域一次。
      properties:
        stage: {$ref: '#/components/schemas/TaskStatus'}
        prepared_pages: {type: integer, minimum: 0, description: 已保存预览及页面元数据的页数，等于page_count；不表示该页文字已全部识别}
        total_pages: {type: integer, minimum: 1, nullable: true, description: 上传校验确认的原文件总页数；旧任务未知时为null}
        processed_regions: {type: integer, minimum: 0, description: recognized_regions与incomplete_regions之和；不包含仍pending的区域，不等于检测行数或正确字段数}
        recognized_regions: {type: integer, minimum: 0, description: 完成识别的OCR区域数；成功响应不证明语义完整或准确}
        incomplete_regions: {type: integer, minimum: 0, description: 结束处理但结果仍不完整的OCR区域数，需要人工核对}
        total_regions: {type: integer, minimum: 0, nullable: true, description: 只有原文件全部页完成分区计划且有持久化证明时才返回OCR区域总数；未完成计划或旧记录无证明时为null，纯文字PDF完成计划后为0}

    Page:
      type: object
      required:
      - page_id
      - page_index
      - width
      - height
      - extraction_method
      properties:
        page_id:
          type: string
          format: uuid
        page_index:
          type: integer
          minimum: 1
          description: 文件内部页序号，从1开始
        width:
          type: integer
          minimum: 1
          description: corrected完整页预览的像素宽度
        height:
          type: integer
          minimum: 1
          description: corrected完整页预览的像素高度
        extraction_method:
          type: string
          enum:
          - pdf_text
          - ocr
          - mixed
          - pending
          description: 可靠PDF文字层优先；仅图像/不可靠区域OCR，混合页为mixed
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        image_preprocessing:
          $ref: '#/components/schemas/ImagePreprocessing'

    ImagePreprocessing:
      type: object
      additionalProperties: false
      description: '毕业证、学位证、身份证正反面、银行卡、营业执照、学信网备案表、护照及户口本照片的新识别结果返回。银行卡bank-card-upright-v1先检测卡片区域判向，区域仅供分析，校正与OCR保留完整照片。其余使用certificate-upright-v1。EXIF之后的CPU自动方向与小角度校正；预览和OCR使用同一校正决定。分数仅为未标定方向证据，不是字段置信度。原件、历史任务、PDF、体检及通用识别不改。'
      required: [version, model_sha256, rotation_degrees, deskew_degrees, status, elapsed_seconds]
      properties:
        version: {type: string}
        model_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        rotation_degrees: {type: integer, enum: [0, 90, 180, 270], description: 'EXIF之后实际采用的逆时针直角旋转量；判断不足时为0'}
        deskew_degrees: {type: number, minimum: -12, maximum: 12, description: '直角纠正后实际采用的逆时针微调角度；未采用为0'}
        orientation_score: {type: number, minimum: 0, maximum: 1, nullable: true, description: '被采用判向输入的中心和全图视图一致时两者较高分数；银行卡可采用内部卡片区域/横置/白边视图，不表示整张照片的概率；不一致或均未通过时可为0，未推理为null'}
        orientation_margin: {type: number, minimum: 0, maximum: 1, nullable: true, description: '两个视图第一与第二名差值中的较小值；不一致时为0，未推理为null'}
        status: {type: string, enum: [unchanged, unavailable, uncertain, insufficient_text, already_level, skew_uncertain, deskew_applied]}
        warning: {type: string, nullable: true, enum: [IMAGE_UPRIGHT_UNAVAILABLE, IMAGE_UPRIGHT_UNCERTAIN, IMAGE_DESKEW_UNCERTAIN, null]}
        elapsed_seconds: {type: number, minimum: 0, description: '第一遍方向检测、倾角估计及像素校正总耗时，包含首次依赖/模型初始化；不含解码EXIF、第二遍按决定重放、PNG保存及OCR'}

    TaskList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}

    ExtractOptions:
      type: object
      description: 抽取参数，仅对 MEDICAL_REPORT 生效
      properties:
        abnormal_only:
          type: boolean
          default: false
          description: 兼容参数；始终全量抽取与整理后才投影已确认异常及未知项，不减少存储结果或stats，items_filter=all仍有效
        include_normal_summary:
          type: boolean
          default: true
          description: 仅决定是否生成正常项摘要，不影响全量抽取、items或stats

    FieldSource:
      type: object
      description: 字段证据来源，区别于Batch/Task接入来源；鉴权后返回完整业务证据原文
      properties:
        page: {type: integer, minimum: 1, description: '对应pages[].page_index'}
        region_id: {type: string, format: uuid, description: 页内抽取区域ID}
        extraction_method: {type: string, enum: [pdf_text, ocr]}
        bbox_kind:
          type: string
          enum: [region, block, row, cell]
          description: 可选定位粒度；旧结果缺省为未声明，不能把整区域框当精确字段框；当前界面仅显示页码和粒度
        bbox:
          type: array
          description: 归一化坐标 [x0, y0, x1, y1]，相对corrected完整页而非裁剪区域；x0<x1且y0<y1。无法可靠定位时省略，不伪造字框
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
        raw_text: {type: string, description: 完整业务证据原文，永不包含CVV}

    ReportFinding:
      type: object
      additionalProperties: false
      required:
      - finding_id
      - reported_number
      - text
      - sources
      properties:
        project_name:
          type: string
          nullable: true
          description: 从清单项目列可靠提取的项目名称；无明确项目列时为null，人工关联可采用所选检测项目名
        finding_id:
          type: string
          format: uuid
          description: 同一run内稳定条目ID；不使用原始编号作主键
        reported_number:
          type: string
          nullable: true
          description: 报告原始编号；只有项目符号或无编号时为null
        text:
          type: string
          description: 报告原有条目文字，鉴权后完整返回，不写入诊断日志
        risk_grade:
          type: string
          nullable: true
          description: 可选报告等级原文；未可靠提取为null，不表示临床严重程度
        diagnosis:
          type: string
          nullable: true
          description: 可选报告诊断原文；不生成医学诊断，缺失或冲突为null
        result_raw:
          type: string
          nullable: true
          description: 仅唯一精确项目对应时关联检测原值，否则null并要求复核；不改写text或清单计数
        result_sources:
          type: array
          description: 对应检测结果来源，与清单sources分开；无法唯一关联为[]
          items:
            $ref: '#/components/schemas/FieldSource'
        need_review:
          type: boolean
          description: 新版明确表示是否待核对；缺失或冲突的检测关联不得视作已完成
        review_issues:
          type: array
          items:
            $ref: '#/components/schemas/ReviewIssue'
        sources:
          type: array
          description: 条目来源，可跨页；没有可靠定位时不伪造bbox
          items:
            $ref: '#/components/schemas/FieldSource'
        reviewed:
          type: boolean
        reviewed_by:
          type: string
          nullable: true
        value_origin:
          type: string
          enum:
          - recognized
          - manual
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE
        result_item_id:
          type: string
          format: uuid
          nullable: true

    ReportSummary:
      type: object
      required:
      - scope
      - declared_count
      - findings
      - count_check
      - sources
      description: "独立的报告结论清单，不与实验室stats.abnormal对账。\n优先按实际标题及章节边界定位“您共有 X项异常需进一步检查并治疗：”等声明，数量只能核对同一标题作用域的清单。\n未找到该标题时可提取总检结论列表，但declared_count=null且count_check=unverified；不固定页码，不把解释段或人体位置图加入清单。\n\
        复合顶层条目不按分号擅自拆分，续页解释不重复计数；findings.length只表示观察提取条数。\n不受items_filter、abnormal_only、include_normal_summary影响，不修改医疗完整覆盖/统计/审核状态，不涉及医学分级。\n\
        \ 人工核对版本可更正声明数量并保留recognition_declared_count与manual_review；不改原执行证据。"
      properties:
        scope:
          type: string
          enum:
          - follow_up_required
          - overall_conclusion
          - unidentified
          description: follow_up_required为明确标题下需进一步检查及治疗的清单；未找到该标题可返回overall_conclusion总检结论列表，无可靠列表则unidentified。后两者declared_count必须null且count_check必须unverified，不跨清单比较
        declared_count:
          type: integer
          nullable: true
          minimum: 0
          description: 同一清单的明确数量声明；缺失、冲突或不可靠时null，不能用findings长度反填
        findings:
          type: array
          description: 同一清单的观察条目，finding_id唯一；空列表不表示无异常
          items:
            $ref: '#/components/schemas/ReportFinding'
        count_check:
          type: string
          enum:
          - match
          - mismatch
          - unverified
          description: match须有明确声明、同一清单完整边界证据、无编号/候选冲突且数量一致；数量相等本身不足。声明缺失或覆盖不可靠为unverified；可靠证据不一致为mismatch。匹配不代表全报告完整或可跳过复核
        sources:
          type: array
          description: 声明、标题和章节边界的完整业务证据，仅经鉴权返回
          items:
            $ref: '#/components/schemas/FieldSource'
        recognition_declared_count:
          type: integer
          nullable: true
          minimum: 0
        manual_review:
          type: object
          additionalProperties: false
          required:
          - source_page
          - reason
          - reviewed_by
          properties:
            source_page:
              type: integer
              minimum: 1
            reason:
              type: string
              minLength: 1
              maxLength: 1000
              pattern: \S
            reviewed_by:
              type: string
            title:
              type: string
        recognition_scope:
          type: string
          enum:
          - follow_up_required
          - overall_conclusion
          - unidentified

    Confidence:
      type: number
      nullable: true
      minimum: 0
      maximum: 1
      description: 仅经标定的概率可为数值；未经标定或不可用时必须为null，不得填固定0.95等伪置信度

    ConfidenceMethod:
      type: string
      enum: [calibrated, unavailable]
      description: calibrated对应经标定数值；unavailable对应confidence=null。必填字段无置信度须待核对。

    ReviewIssue:
      type: object
      required:
      - issue_id
      - code
      - message
      - can_accept
      properties:
        issue_id:
          type: string
          format: uuid
        code:
          type: string
          description: review_reason代码或服务端扩展字符串
        message:
          type: string
        can_accept:
          type: boolean
          description: 仅非缺失/非冲突问题可由服务端设为true；缺必填/冲突及类型不符/未知/多证混装/输出不完整的任务级问题不可确认放行
        rule_id:
          type: string

    ValidationCheck:
      type: object
      required: [kind, status, rule_id, message]
      properties:
        kind: {type: string, enum: [FORMAT, CHECKSUM, CROSS_DOCUMENT, OFFICIAL]}
        status: {type: string, enum: [PASS, FAIL, UNKNOWN, NOT_APPLICABLE]}
        rule_id: {type: string}
        message: {type: string}

    Field:
      type: object
      required:
      - key
      - label
      - value
      - confidence
      - confidence_method
      - need_review
      - review_issues
      properties:
        key:
          type: string
        label:
          type: string
        value:
          description: 值，可能是string/number/boolean/null；鉴权后返回完整业务值，前端使用此值展示和复核。日期保留原文的YYYY-MM或YYYY-MM-DD精度；DIPLOMA正文学习区间开始为enroll_date、结束为graduate_date，落款仅为issue_date，不补造具体日
          oneOf:
          - type: string
            nullable: true
          - type: number
          - type: boolean
        value_masked:
          type: string
          nullable: true
          deprecated: true
          description: 历史兼容字段，当前默认完整显示不使用；使用value。
        confidence:
          $ref: '#/components/schemas/Confidence'
        confidence_method:
          $ref: '#/components/schemas/ConfidenceMethod'
        need_review:
          type: boolean
        review_reason:
          type: string
          nullable: true
          enum:
          - LOW_CONFIDENCE
          - VALIDATION_FAILED
          - MISSING
          - CORRECTION_PROPOSED
          - CONFIDENCE_UNAVAILABLE
          - CONFLICT
          - INCOMPLETE_OUTPUT
          - MULTI_CANDIDATES
          - null
        review_issues:
          type: array
          items:
            $ref: '#/components/schemas/ReviewIssue'
        validation_error:
          type: string
          nullable: true
          description: BIN_UNKNOWN表示本地BIN库未覆盖，不等于卡号无效
          enum:
          - ID_CHECKSUM_FAILED
          - USCC_CHECKSUM_FAILED
          - XUEXIN_CODE_INVALID
          - LUHN_FAILED
          - BIN_UNKNOWN
          - INVALID_DATE
          - null
        validation_checks:
          type: array
          items:
            $ref: '#/components/schemas/ValidationCheck'
        candidates:
          type: array
          description: 银行卡全部候选均需人工选择，不能凭Luhn/BIN自动改号；无逐位top3或完整候选覆盖保证，候选值经鉴权完整返回
          items:
            type: object
            required:
            - value
            - confidence
            - confidence_method
            properties:
              value:
                oneOf:
                - type: string
                  nullable: true
                - type: number
                - type: boolean
              confidence:
                $ref: '#/components/schemas/Confidence'
              confidence_method:
                $ref: '#/components/schemas/ConfidenceMethod'
              reason:
                type: string
                example: 补充文字识别
              source:
                $ref: '#/components/schemas/FieldSource'
        source:
          $ref: '#/components/schemas/FieldSource'
        sources:
          type: array
          description: 可选多来源列表；银行卡保留卡面与补充文字的证据；体检项目清单保留每个项目单元格的原文、页码与范围，source仍为主定位来源
          items: {$ref: '#/components/schemas/FieldSource'}
        reviewed:
          type: boolean
        reviewed_by:
          type: string
          nullable: true
        value_origin:
          type: string
          enum:
          - recognized
          - manual
          - derived
        required:
          type: boolean
        editable:
          type: boolean
        absence_reason:
          type: string
          enum:
          - NOT_ON_DOCUMENT
          - NOT_APPLICABLE
        accepted_validation_rules:
          type: array
          items:
            type: string
        derivation:
          $ref: '#/components/schemas/FieldDerivation'
      additionalProperties: false
    FieldDerivation:
      oneOf:
      - $ref: '#/components/schemas/BankFieldDerivation'
      - $ref: '#/components/schemas/MedicalLedgerDerivation'
    MedicalLedgerDerivation:
      type: object
      additionalProperties: false
      required: [method, input_field]
      properties:
        method:
          type: string
          enum: [medical_ledger]
        input_field:
          type: string
          enum: [items, exam_projects]
        conclusions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, source]
            properties:
              value:
                type: string
              source:
                $ref: '#/components/schemas/FieldSource'
    BankFieldDerivation:
      type: object
      additionalProperties: false
      required:
      - method
      - input_field
      - dataset_id
      - dataset_version
      - data_updated_at
      - retrieved_at
      - source_url
      - license
      - data_sha256
      - names_sha256
      - matched_prefix
      - bank_code
      - card_number_length
      properties:
        method:
          type: string
          enum:
          - offline_bin
        input_field:
          type: string
          enum:
          - card_number
        dataset_id:
          type: string
          enum:
          - hexindai-bcbc
        dataset_version:
          type: string
          pattern: ^[a-f0-9]{40}$
        data_updated_at:
          type: string
          format: date
        retrieved_at:
          type: string
          format: date
        source_url:
          type: string
          format: uri
        license:
          type: string
          enum:
          - MIT
        data_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        names_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        matched_prefix:
          type: string
          pattern: ^(?:[0-9]{6}|[0-9]{8})$
        bank_code:
          type: string
        card_number_length:
          type: integer
          minimum: 10
          maximum: 19
      description: 离线社区BIN快照的派生来源，不是OCR证据或官方账户核验。只用于当前value_origin=derived字段；人工覆盖或未匹配时移除，不修改原始卡号证据。卡种保留上游DC/CC/SCC/PC代码，不推断卡组织。

    MedicalItem:
      type: object
      additionalProperties: false
      required:
      - item_id
      - name
      - result_raw
      - abnormal_flag
      - reported_abnormal_marker
      - abnormal_basis
      - confidence
      - confidence_method
      - need_review
      - review_issues
      properties:
        item_id:
          type: string
          format: uuid
          description: 服务端分配的项目稳定ID，复核更新或删除据此定位
        name:
          type: string
          example: 总胆固醇
        alias:
          type: string
          nullable: true
          example: TC
        category:
          type: string
          nullable: true
          example: 血脂
        result_raw:
          type: string
          example: '6.82'
        risk_grade:
          type: string
          nullable: true
          description: 可选报告等级原文；非空且非A或/为新增异常依据，缺失不表示正常，不是临床严重程度
        diagnosis:
          type: string
          nullable: true
          description: 可选同表诊断或唯一精确项目对应的报告诊断原文；缺失或冲突为null，不生成医学诊断
        diagnosis_sources:
          type: array
          description: 独立诊断来源；无可靠诊断为[]，不得以相似名称或多行候选猜配
          items:
            $ref: '#/components/schemas/FieldSource'
        value_num:
          type: number
          nullable: true
          example: 6.82
          description: 仅精确标量；>5.0等带比较符结果为null且result_raw原样保留
        unit:
          type: string
          nullable: true
          example: mmol/L
        reference_range:
          type: string
          nullable: true
          example: 2.80-5.17
        ref_low:
          type: number
          nullable: true
        ref_high:
          type: number
          nullable: true
        abnormal_flag:
          type: string
          enum:
          - NORMAL
          - HIGH
          - LOW
          - ABNORMAL
          - POSITIVE
          - UNKNOWN
          description: POSITIVE可保留检出事实但不自动等于异常；abnormal_basis=unknown时仅允许UNKNOWN/POSITIVE，不据省略推断正常
        reported_abnormal_marker:
          type: string
          nullable: true
          description: 报告原始异常标记，如↑、↓或阳性，不擅自补写
        abnormal_basis:
          type: string
          enum:
          - report_marker
          - report_grade
          - reference_comparison
          - unknown
          description: report_marker=报告明确标记或明确异常诊断；report_grade=可靠非空且非A或/的报告等级；reference_comparison=适用规则比较确认；unknown=无足够依据。A或/不清除已有箭头、参考区间或明确诊断的异常事实，不推断临床严重度
        abnormal_exclusion_reason:
          type: string
          nullable: true
          enum: [HEIGHT_WEIGHT, SECTION_SUMMARY, null]
          description: 服务端派生的异常/复核范围排除原因。HEIGHT_WEIGHT=身高、体重或独立身高体重行；SECTION_SUMMARY=历史结果中的精确小结行。保留原值/等级/诊断/标记及原始review_issues，但need_review=false，不进入异常/待判定筛选、abnormal_summary、统计、复核编辑器或复核阻断项。BMI不排除；客户端不可编辑
        deviation:
          type: string
          nullable: true
          description: 可选数值偏离说明，仅精确数值且适用边界非零时计算，否则null；不代表临床严重程度或跨项目风险排序
        confidence:
          $ref: '#/components/schemas/Confidence'
        confidence_method:
          $ref: '#/components/schemas/ConfidenceMethod'
        need_review:
          type: boolean
        review_issues:
          type: array
          items:
            $ref: '#/components/schemas/ReviewIssue'
        source:
          $ref: '#/components/schemas/FieldSource'
        reviewed:
          type: boolean
        reviewed_by:
          type: string
          nullable: true
        value_origin:
          type: string
          enum:
          - recognized
          - manual
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE

    MedicalStats:
      type: object
      required: [total, normal, abnormal, unknown, categories]
      description: |
        基于完整抽取及整理结果计算，不受abnormal_only、items_filter或摘要开关影响；模型漏项不代表无异常。
        页面/区域结果不完整时total、normal、abnormal、unknown均为null，并在TaskResult.limitations解释；完整时total=normal+abnormal+unknown。四项计数仅包含异常判定范围内的检测行，排除abnormal_exclusion_reason=HEIGHT_WEIGHT/SECTION_SUMMARY；items仍保留这些原始行，体重指数/BMI仍计入。
      properties:
        total: {type: integer, minimum: 0, nullable: true, description: 完整整理后为三个互斥分类计数之和；输出不完整时为null}
        normal: {type: integer, minimum: 0, nullable: true}
        abnormal: {type: integer, minimum: 0, nullable: true, description: 仅报告或适用规则确认的异常；不把所有POSITIVE自动计入}
        unknown: {type: integer, minimum: 0, nullable: true, description: UNKNOWN及abnormal_basis=unknown的POSITIVE；输出不完整时为null}
        categories:
          type: array
          items: {type: string}

    HouseholdMember:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Field'
        gender:
          $ref: '#/components/schemas/Field'
        birth_date:
          $ref: '#/components/schemas/Field'
        ethnicity:
          $ref: '#/components/schemas/Field'
        birth_place:
          $ref: '#/components/schemas/Field'
        native_place:
          $ref: '#/components/schemas/Field'
        id_number:
          $ref: '#/components/schemas/Field'
        relation_to_householder:
          $ref: '#/components/schemas/Field'
        education:
          $ref: '#/components/schemas/Field'
        marital_status:
          $ref: '#/components/schemas/Field'
        occupation:
          $ref: '#/components/schemas/Field'
        workplace:
          $ref: '#/components/schemas/Field'
        migration_address:
          $ref: '#/components/schemas/Field'
        member_id:
          type: string
          format: uuid
          description: 仅人工新增成员的服务端ID
        source_page:
          type: integer
          minimum: 1
          description: 人工新增成员的来源页；原成员仍以字段source定位

    TextBlock:
      type: object
      required: [text, page, confidence, confidence_method]
      properties:
        text: {type: string, description: 鉴权后完整返回的业务全文片段，不含CVV}
        raw_text: {type: string, description: 可选原始OCR或PDF文字，结构标记保持原样，仅作为文本显示}
        source: {$ref: '#/components/schemas/FieldSource'}
        page: {type: integer, minimum: 1, description: '当前run的pages[].page_index，定位多页通用识别文本'}
        bbox:
          type: array
          description: 相对corrected完整页的归一化坐标[x0,y0,x1,y1]
          items: {type: number, minimum: 0, maximum: 1}
          minItems: 4
          maxItems: 4
        confidence: {$ref: '#/components/schemas/Confidence'}
        confidence_method: {$ref: '#/components/schemas/ConfidenceMethod'}

    XuexinKindCheck:
      type: string
      description: |
        种类校验结果（不是证件类型）。doc_type 已固定为 XUEXIN_DIPLOMA_TABLE，
        这里表示「这份材料到底是不是备案表」，包括文字PDF、扫描件及图像。
        DIPLOMA_TABLE = 确认是备案表，正常抽取字段；
        OTHER_REPORT  = 识别为其他学信网报告（学籍在线验证报告 / 学位在线验证报告 / 学历或学位认证报告），
                        一律置 NEED_REVIEW 且不抽取字段，提示用户改提供备案表；
        UNKNOWN       = 无法判定，置 NEED_REVIEW；report_kind_confidence可以为null。
      enum:
        - DIPLOMA_TABLE
        - OTHER_REPORT
        - UNKNOWN

    ManualVerifyStatus:
      type: string
      description: |
        人工在线核验状态；本版不接入自动验证，由操作员手工标记。
      enum:
        - NOT_CHECKED
        - VERIFIED_OK
        - VERIFIED_MISMATCH
        - VERIFY_FAILED

    XuexinInfo:
      type: object
      description: 仅 doc_type = XUEXIN_DIPLOMA_TABLE 时返回
      properties:
        report_kind: {$ref: '#/components/schemas/XuexinKindCheck'}
        report_kind_confidence: {$ref: '#/components/schemas/Confidence'}
        report_kind_confidence_method: {$ref: '#/components/schemas/ConfidenceMethod'}
        # 在线验证码：去空白后12/16位ASCII字母数字仅作兼容候选规则，非官方真伪验证
        online_verification_code:
          type: string
          nullable: true
          description: 展示用，完整保留材料中的原始分组格式
          example: "0908 8869 3519"
        online_verification_code_normalized:
          type: string
          nullable: true
          description: 去所有空白后的本地格式校验用值；兼容候选为12或16位ASCII字母数字，未确认版本不因含字母硬拒绝
          example: "090888693519"
        code_valid: {type: boolean, nullable: true, description: 仅本地格式结果，非官方真实性；未确认版本或规则不适用时为null（UNKNOWN）并待核对}
        verify_url:
          type: string
          description: 学信网在线验证页，复核页需提供「一键复制验证码 + 打开验证页」
          example: "https://www.chsi.com.cn/xlcx/bgcx.jsp"
        valid_until:
          type: string
          format: date
          nullable: true
          description: 验证有效期；早于今天会触发 Batch 告警 XUEXIN_DIPLOMA_EXPIRED
        is_expired: {type: boolean, nullable: true, description: 缺失或无法确定有效期时为null，不推断未过期}
        manual_verify_status: {$ref: '#/components/schemas/ManualVerifyStatus'}
        manual_verify_by: {type: string, nullable: true}
        manual_verify_at: {type: string, format: date-time, nullable: true}
        report_language:
          type: string
          description: zh=中文版；en=翻译件（英文），姓名为拼音、枚举值需映射为中文标准值
          enum: [zh, en]
        source_kind:
          type: string
          description: |
            pdf_text    = 可靠PDF文字层提取；不自动代表经标定的高置信度
            scanned_pdf = 扫描PDF，使用OCR
            mixed_pdf   = 文字层与图像区域混合，逐区域选择提取方式
            screenshot  = 电子截图 / 微信转发图（清晰但可能被压缩、可能截断）
            screen_photo= 用手机翻拍电脑屏幕（有摩尔纹、反光、透视变形，最难）
            photo       = 普通材料照片；unknown = 无法确定来源形态
          enum: [pdf_text, scanned_pdf, mixed_pdf, screenshot, screen_photo, photo, unknown]
        likely_truncated:
          type: boolean
          nullable: true
          description: |
            仅 screenshot / screen_photo：疑似截图不完整（只截了上半部分或边缘被裁），
            检测到必填字段集中在图像一侧且底部空白时置 true，见 SPEC 6.10.8

    GenericResult:
      type: object
      description: blocks、key_values与full_text经鉴权后完整返回；仍禁止包含CVV及内部私有元数据
      properties:
        doc_subtype_guess: {type: string, nullable: true}
        doc_subtype_confidence: {$ref: '#/components/schemas/Confidence'}
        doc_subtype_confidence_method: {$ref: '#/components/schemas/ConfidenceMethod'}
        blocks:
          type: array
          items: {$ref: '#/components/schemas/TextBlock'}
        key_values:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              value: {type: string, nullable: true}
              pair_id: {type: string, format: uuid, description: 原始键值的稳定来源标识，同名字段不合并}
              source: {$ref: '#/components/schemas/FieldSource'}
              basis: {type: string, enum: [label, aligned_label, table_cells, header_value]}
              confidence: {$ref: '#/components/schemas/Confidence'}
              confidence_method: {$ref: '#/components/schemas/ConfidenceMethod'}
        full_text: {type: string}
        extraction_notes: {type: array, items: {type: string}}
        tables:
          type: array
          description: 保留的原始表格，不确定键值关系时不强制配对；完整矩阵文字同时保留于正文
          items:
            type: object
            required: [rows, merges, source]
            properties:
              rows: {type: array, maxItems: 1000, items: {type: array, maxItems: 200, items: {type: string}}}
              merges: {type: array, items: {$ref: '#/components/schemas/TableMerge'}}
              source: {$ref: '#/components/schemas/FieldSource'}

    TableMerge:
      type: object
      additionalProperties: false
      required: [row, column, rowspan, colspan]
      properties:
        row: {type: integer, minimum: 0, maximum: 999}
        column: {type: integer, minimum: 0, maximum: 199}
        rowspan: {type: integer, minimum: 1, maximum: 1000}
        colspan: {type: integer, minimum: 1, maximum: 200}
    PhotoTableReview:
      type: object
      additionalProperties: false
      required: [table_id, title, header_rows, rows, merges, partial_acknowledged]
      description: 仅修改当前任务已存在的table_id。矩阵最多10000格、总文本100万字符；合并不可越界/重叠/覆盖非空格。原始来源与初始识别不可由客户端改写。title可以为空；header_rows为null时可保存草稿，但不能导出。无标题的Excel不插标题行，矩阵从第一行开始。
      properties: &table_review_properties
        table_id: {type: string, format: uuid}
        title: {type: string, maxLength: 200, description: 选填标题，空字符串表示无标题；已保存空值不使用候选回填}
        header_rows: {type: integer, minimum: 0, maximum: 1000, nullable: true, description: 从首行起的表头行数，0表示无表头，null表示待确认}
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: array
            minItems: 1
            maxItems: 200
            items: {type: string, maxLength: 32767}
        merges:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/TableMerge'}
        partial_acknowledged: {type: boolean, description: 对不完整初始输出明确确认人工已补正或仅导出所保留部分}
    PhotoTable:
      type: object
      required: [table_id, title, header_rows, rows, merges, partial_acknowledged, source, candidates, title_candidates, outside_text, quality_warnings, incomplete, confidence]
      properties:
        <<: *table_review_properties
        header_suggestion: {type: integer, nullable: true, minimum: 0, maximum: 1000, description: 有依据的表头建议行数，0表示无表头，null表示无法可靠判断；不是已保存审核值}
        header_suggestion_source: {type: string, nullable: true, enum: [model_tags, structure, data_rows, null], description: 可选建议依据。首次草稿及无人工版本的导出只自动采用带已知来源且结构完整的建议；旧结果缺少此属性不自动采用，已保存header_rows包括0/null优先}
        source: {$ref: '#/components/schemas/FieldSource'}
        candidates:
          type: array
          items:
            type: object
            properties:
              bbox: {type: array, minItems: 4, maxItems: 4, items: {type: number, minimum: 0, maximum: 1}}
        title_candidates:
          description: 保留既有匹配顺序；无人工版本且初始标题为空时采用首个有效非空候选，跳过超过200字或含控制字符的候选。原始候选不改写。
          type: array
          items: {$ref: '#/components/schemas/TableSnippet'}
        outside_text:
          type: array
          items: {$ref: '#/components/schemas/TableSnippet'}
        quality_warnings: {type: array, items: {type: string}}
        incomplete: {type: boolean}
        confidence: {type: number, nullable: true, enum: [null]}
    TableSnippet:
      type: object
      required: [text, box]
      properties:
        text: {type: string}
        box: {type: array, minItems: 4, maxItems: 4, items: {type: number}, description: 校正页像素坐标；仅标题/表外文本候选，不自动推断业务归属}

    TaskResult:
      type: object
      required:
      - task_id
      - doc_type
      - run_id
      - result_revision
      - status
      - review_issues
      oneOf:
      - required:
        - basic_info
        - items
        - stats
        - abnormal_summary
        properties:
          doc_type:
            type: string
            enum:
            - MEDICAL_REPORT
      - properties:
          doc_type:
            type: string
            enum:
            - ID_CARD_FRONT
            - ID_CARD_BACK
            - DIPLOMA
            - DEGREE_CERT
            - BANK_CARD
            - INTERVIEW_FORM
            - HOUSEHOLD_REGISTER
            - BUSINESS_LICENSE
            - XUEXIN_DIPLOMA_TABLE
            - GENERIC
            - PASSPORT
      - required: [tables]
        properties:
          doc_type: {type: string, enum: [TABLE]}
      properties:
        tables:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/PhotoTable'}
        reviewed_tables:
          description: 人工保存版本；存在时完全优先，包括主动清空标题。缺省时可直接导出完整的初始表格及首个有效标题候选/有来源的表头建议。标题可空，不写人工审核或改变状态/版本。
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/PhotoTableReview'}
        required_fields_revision: {type: integer, minimum: 0, description: 本次投影所用共享设置版本；不改变result_revision}
        required_field_keys:
          type: array
          items: {type: string}
          description: 当前材料及值条件下的有效必填集合，含members.key和generic.full_text；缺省时兼容旧默认
        export_ready:
          type: boolean
          description: 已保存未筛选结果必填值齐全且无未处理的明确异议时true，与COMPLETED独立；医疗筛选不改变此值，导出不改变审核/识别状态。
        export_disputes:
          type: array
          description: 未筛选保存结果上的明确异议；人工确认仅影响导出资格，不修改原值或提升置信度。
          items: {$ref: '#/components/schemas/ExportDispute'}
        export_blockers:
          type: array
          description: 与export_ready同源的匿名字段路径和代码；MISSING为缺值，DISPUTED为未处理的明确异议，不包含原值。
          items: {$ref: '#/components/schemas/ExportBlocker'}
        task_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        result_revision:
          type: integer
          minimum: 0
        doc_type:
          $ref: '#/components/schemas/DocTypeEnum'
        status:
          $ref: '#/components/schemas/TaskStatus'
        review_issues:
          type: array
          description: 任务级待处理问题，如OTHER_REPORT/UNKNOWN/多证混装/输出不完整，必须can_accept=false；不能通过确认跳过修正或重传
          items:
            $ref: '#/components/schemas/ReviewIssue'
        fields:
          type: array
          description: DIPLOMA为SPEC6.4的11项，不含principal/study_mode；历史结果同样仅作公开投影过滤，原文证据/加密历史/版本不改。DEGREE_CERT与学信备案表同名字段不受此限制
          items:
            $ref: '#/components/schemas/Field'
        basic_info:
          type: object
          description: MEDICAL_REPORT当前8个字段；已移除report_no/report_date/package_name/institution，新增选填exam_projects正文项目意义表的项目列清单。列表保持原名顺序，以中文分号连接，独立于items/异常统计；Field.sources可逐项定位；旧结果投影当前字段，新清单可空缺手工补录。marital_status/phone/work_unit可选，姓名/性别/年龄/体检日期及这三项优先取自可靠个人信息标题表，不固定页码或匹配目录项；候选冲突待复核，缺失不猜补。phone及同响应原文/来源/候选按用户授权在鉴权后显示完整业务值；保留加密原始证据和安全诊断边界
          additionalProperties:
            $ref: '#/components/schemas/Field'
        items:
          type: array
          description: MEDICAL_REPORT完整整理后的项目投影；省略items_filter遵从abnormal_only，显式all永远返回全量
          items:
            $ref: '#/components/schemas/MedicalItem'
        stats:
          $ref: '#/components/schemas/MedicalStats'
        abnormal_summary:
          type: array
          description: 报告或适用规则确认的异常项摘要，**无论开关如何始终返回**；不将所有阳性自动视为异常
          items:
            $ref: '#/components/schemas/MedicalItem'
        normal_summary:
          type: string
          nullable: true
          description: 正常项摘要；include_normal_summary=false时为null，不影响items或stats，也不以省略项目推断正常
        report_summary:
          $ref: '#/components/schemas/ReportSummary'
        members:
          type: array
          nullable: true
          description: HOUSEHOLD_REGISTER 常住人口登记卡
          items:
            $ref: '#/components/schemas/HouseholdMember'
        generic:
          $ref: '#/components/schemas/GenericResult'
        limitations:
          type: array
          description: 结果受限说明，如"输出不完整"或"报告页疑似缺失"；不得把未识别到解释为无异常
          items:
            type: string
        reviewed_by:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        xuexin_info:
          $ref: '#/components/schemas/XuexinInfo'
        passport:
          $ref: '#/components/schemas/PassportInfo'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        recognition_status:
          $ref: '#/components/schemas/TaskStatus'
        recognition_error:
          type: object
          nullable: true
          additionalProperties: true
        completion_origin:
          type: string
          enum:
          - human_review
        coverage_review:
          $ref: '#/components/schemas/CoverageReview'
        reviewed_generic:
          $ref: '#/components/schemas/ReviewedGeneric'

    ReviewRequest:
      type: object
      additionalProperties: false
      required:
      - run_id
      - expected_revision
      properties:
        tables:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/PhotoTableReview'}
        run_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 0
        fields:
          type: object
          additionalProperties:
            oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE
        confirm_export_disputes:
          type: boolean
          default: false
          description: 普通保存按钮提交true，在同一授权和版本事务内先修正重校验，再确认保存后所有有明确值的异议，无需理由。必填缺失及未选定的空值冲突不能跳过。原始证据不改，服务端记录确认账号和时间。省略或false保留仅修正语义；不与confirmed_disputes混用，不适用于TABLE。
        confirmed_disputes:
          type: array
          maxItems: 10000
          uniqueItems: true
          description: 兼容既有客户端的逐项确认接口；当前网页使用confirm_export_disputes随保存完成核对。此列表不能与字段或其他修正混用。ID取自当前export_disputes，空值冲突须先补正；绑定run/revision，值或关联上下文变化后失效。
          items: {type: string, pattern: '^d_[0-9a-f]{64}$'}
        accepted_issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - issue_id
            properties:
              issue_id:
                type: string
                format: uuid
              reason:
                type: string
                maxLength: 1000
                description: 可选补充说明；允许省略或空串。仅can_accept问题可确认，必填缺失、冲突及未完成覆盖不可跳过。
        items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MedicalItemEditable'
            - required:
              - item_id
        added_items:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/MedicalItemEditable'
            - required:
              - name
              - result_raw
              not:
                required:
                - item_id
        removed_item_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingPatch'
        report_summary:
          $ref: '#/components/schemas/SummaryReview'
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - index
            properties:
              index:
                type: integer
                minimum: 0
              fields:
                type: object
                additionalProperties:
                  oneOf:
                  - type: string
                    nullable: true
                  - type: number
                  - type: boolean
              absence_reasons:
                type: object
                additionalProperties:
                  type: string
                  enum:
                  - NOT_ON_DOCUMENT
                  - NOT_APPLICABLE
        coverage:
          $ref: '#/components/schemas/CoverageReview'
        generic:
          $ref: '#/components/schemas/ReviewedGeneric'
        note:
          type: string
          maxLength: 1000
          nullable: true
        added_members:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - fields
            - source_page
            properties:
              fields:
                type: object
                additionalProperties:
                  oneOf:
                  - type: string
                    nullable: true
                  - type: number
                  - type: boolean
              absence_reasons:
                type: object
                additionalProperties:
                  type: string
                  enum:
                  - NOT_ON_DOCUMENT
                  - NOT_APPLICABLE
              source_page:
                type: integer
                minimum: 1
        removed_member_indexes:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
      description: 只提交实际补正；服务端基于类型目录检查可编辑字段、条件必填及字段类型。空提交或note不能直接完成。所有ID须属于当前版本，缺失/冲突/未完成区域不可经accepted_issues跳过。失败执行仅在完整原件页面可读并逐页补正后生成独立人工版本，不改写原执行错误。
        户口本须逐页coverage并至少一名成员；新增成员指定source_page，删除和修改同一原成员索引被拒绝。

    MedicalItemEditable:
      type: object
      additionalProperties: false
      required: []
      properties:
        item_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        alias:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        result_raw:
          type: string
        unit:
          type: string
          nullable: true
        reference_range:
          type: string
          nullable: true
        reported_abnormal_marker:
          type: string
          nullable: true
        risk_grade:
          type: string
          nullable: true
        diagnosis:
          type: string
          nullable: true
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE
      description: 项目补正只能修改原始业务值，数值解析、异常判定、来源和置信度均由服务端维护。新增项目禁止item_id。

    BatchDeleteRequest:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          minItems: 1
          description: 必须覆盖当前整包全部任务；每次上传的100份限制不限制整包累计任务数。
          items:
            type: object
            additionalProperties: false
            required: [task_id, run_id, expected_revision]
            properties:
              task_id: {type: string, format: uuid}
              run_id: {type: string, format: uuid}
              expected_revision: {type: integer, minimum: 0}

    BatchDeleteResponse:
      type: object
      additionalProperties: false
      required: [batch_id, task_ids, cleanup_pending]
      properties:
        batch_id: {type: string, format: uuid}
        task_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
