          type: string
          nullable: true
        result_item_id:
          type: string
          format: uuid
          nullable: true
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE

    NewFinding:
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
        risk_grade:
          type: string
          nullable: true
        diagnosis:
          type: string
          nullable: true
        result_item_id:
          type: string
          format: uuid
          nullable: true
        absence_reasons:
          type: object
          additionalProperties:
            type: string
            enum:
            - NOT_ON_DOCUMENT
            - NOT_APPLICABLE

    SummaryReview:
      type: object
      additionalProperties: false
      required:
      - reason
      - source_page
      properties:
        declared_count:
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        source_page:
          type: integer
          minimum: 1
        added_findings:
          type: array
          items:
            $ref: '#/components/schemas/NewFinding'
        removed_finding_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        scope:
          type: string
          enum:
          - follow_up_required
          - overall_conclusion
          - unidentified
        title:
          type: string
          minLength: 1
          pattern: \S
      description: 切换为follow_up_required或更正declared_count须提供原报告标题title、非空reason及source_page；非follow_up_required作用域声明数量必须为null且不核对数量。

    CoverageRegion:
      type: object
      additionalProperties: false
      required:
      - region_id
      - action
      - reason
      properties:
        region_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
          - TRANSCRIBED
          - NO_CONTENT
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        field_keys:
          type: array
          items:
            type: string
        item_ids:
          type: array
          items:
            type: string
            format: uuid
        added_item_indexes:
          type: array
          items:
            type: integer
            minimum: 0
        finding_ids:
          type: array
          items:
            type: string
            format: uuid
        member_indexes:
          type: array
          items:
            type: integer
            minimum: 0
        added_member_indexes:
          type: array
          description: 引用本次added_members数组的位置，不是已有成员索引
          items:
            type: integer
            minimum: 0
        generic:
          type: boolean
          enum:
          - true

    CoverageReview:
      type: object
      additionalProperties: false
      required:
      - pages
      - reason
      properties:
        pages:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          uniqueItems: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
        regions:
          type: array
          items:
            $ref: '#/components/schemas/CoverageRegion'
      description: pages必须覆盖原文件全部页，regions必须精确覆盖所有未完成区域；TRANSCRIBED须关联本次补正字段/项目/清单/成员/正文。服务器验证已有加密页面均可读取。

    ReviewedGeneric:
      type: object
      additionalProperties: false
      required:
      - full_text
      - key_values
      properties:
        full_text:
          type: string
          minLength: 1
          pattern: \S
        key_values:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - value
            properties:
              source_pair_id: {type: string, format: uuid, description: 可选原始键值来源ID，必须属于当前run；不允许提交任意来源坐标}
              key:
                type: string
                minLength: 1
                pattern: \S
              value:
                oneOf:
                - type: string
                  nullable: true
                - type: number
                - type: boolean

    RegionOCRRequest:
      type: object
      additionalProperties: false
      required: [run_id, expected_revision, page, bbox]
      properties:
        run_id: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        field_key:
          type: string
          nullable: true
          pattern: '^[a-z_]+$'
          maxLength: 64
          description: 旧客户端兼容字段，省略/null为通用文字提取；传入时仍须为当前类型可编辑顶层文本/数值字段，性别/布尔及派生字段拒绝。新界面省略，提取文字可人工粘贴到字段、明细或通用正文。
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
          description: 相对于该页corrected图的[x0,y0,x1,y1]；x0<x1且y0<y1。

    RegionOCRResult:
      type: object
      additionalProperties: false
      required: [task_id, run_id, result_revision, page, field_key, bbox, text, confidence]
      properties:
        task_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        result_revision: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        field_key: {type: string, nullable: true, description: 通用提取为null，旧客户端调用回显其字段键。}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
        text: {type: string, minLength: 1, maxLength: 4096}
        confidence: {type: number, minimum: 0, maximum: 1}

    FullPreviewRequest:
      type: object
      additionalProperties: false
      required:
      - run_id
      - expected_revision
      properties:
        run_id:
          type: string
          format: uuid
        expected_revision:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
          default: 1
        reason:
          type: string
          nullable: true
          maxLength: 1000
          description: 可选的历史兼容说明，不要求提供访问理由。

    ExportDispute:
      type: object
      additionalProperties: false
      required: [dispute_id, field, label, code, message, can_confirm]
      properties:
        dispute_id: {type: string, pattern: '^d_[0-9a-f]{64}$'}
        field: {type: string}
        label: {type: string}
        code: {type: string}
        message: {type: string}
        can_confirm: {type: boolean, description: 已保存值可由人工确认；缺少明确候选值、医疗结果关联或诊断未选定时为false，历史确认不能隐藏此类异议}

    ExportBlocker:
      type: object
      additionalProperties: false
      required: [field, code]
      description: 导出检查的匿名字段路径与代码（MISSING、DISPUTED及表格结构代码）。必填按当前profile条件解析，户口本须有成员且各成员必填齐全；GENERIC有reviewed_generic就使用该版本（空值不回退），否则使用识别正文。None、空串、纯空白缺失；0与False有效。
      properties:
        field: {type: string}
        code: {type: string}

    ExportRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        batch_id:
          type: string
          format: uuid
        task_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
          uniqueItems: true
        versions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - task_id
            - run_id
            - result_revision
            properties:
              task_id:
                type: string
                format: uuid
              run_id:
                type: string
                format: uuid
              result_revision:
                type: integer
                minimum: 0
        masked:
          type: boolean
          default: true
          deprecated: true
          description: 历史兼容参数，忽略true/false；operator/admin导出均使用完整业务值。
        reason:
          type: string
          nullable: true
          deprecated: true
          description: 可选的历史兼容说明；允许省略、null或空串，不作为完整值导出的门槛。
          maxLength: 1000
        format:
          type: string
          enum:
          - xlsx
          default: xlsx
      oneOf:
      - required:
        - batch_id
        not:
          required:
          - task_ids
      - required:
        - task_ids
        not:
          required:
          - batch_id
      description: batch_id与task_ids二选一。若传versions必须精确覆盖整个选择；任一无保存结果、必填值缺失或明确异议未处理则409 EXPORT_BLOCKED且不导出任何部分。仅operator/admin可导出，viewer返回403；无额外理由门槛。NEED_REVIEW/FAILED已有结果、必填齐全且无未处理明确异议也可导出；明确格式/校验失败及冲突会阻止导出；未标定置信度、未联网核验、规则未覆盖和通用覆盖提醒不单独阻止，不修改审核/识别状态。XLSX按材料类型输出已保存的中文业务字段和来源文件；体检使用18列审核记录台账，异常指标包含检测结果和异常诊断，排除身高、体重、小结并保留BMI。内部状态、UUID和识别/审核元数据仅留在应用中。

    PassportInfo:
