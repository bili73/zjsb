  /batches:
    get:
      tags:
      - batches
      summary: 批次列表
      description: 按创建时间降序分页；时间存储与传输保留UTC，界面固定Asia/Shanghai（UTC+8）展示。
      description: 任务批次支持按日/周/月分组及对应日期选择器，固定UTC+8，周为周一至周日，组内创建时间降序。首次默认今天，日/周/月显示所选日期所在范围；新上传回到今天所在范围。清空或点击全部日期才跨日期浏览。GET /batches可选date_from/date_to（YYYY-MM-DD，含首尾当地日期），先按UTC+8日期过滤全部历史再统计和分页；错误/倒序范围返回422。不改UTC存储时间。切换范围丢弃迟到列表响应，不清除隐藏批次的在途任务或识别结果；后台任务轮询继续。
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - PARTIAL
          - FAILED
          - CANCELLED
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: keyword
        in: query
        description: 按批次显示名或文件名模糊搜索
        schema:
          type: string
      - name: date_from
        in: query
        schema: {type: string, format: date}
        description: UTC+8当地日期，包含当日；可单独提供
      - name: date_to
        in: query
        schema: {type: string, format: date}
        description: UTC+8当地日期，包含当日；不得早于date_from
      responses:
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
    post:
      tags:
      - batches
      summary: 创建批次（人工上传）
      description: 银行卡直接上传单张JPG/PNG/HEIC照片（可为整张正面或卡号裁图），PDF不支持。上传只做解码与大小检查，不调用模型；每张图片入独立Task，后台默认GLM识别并按现有规则提取卡号、离线匹配银行。卡号缺失、冲突或格式失败时，结果页可只裁这张重识别或手工补录；置信度未知/BIN未覆盖不强迫裁剪。裁图可左右90°旋转，使用真实旋转像素，作为新任务提交；原任务及其他卡片保留。裁图上传失败保留已生成文件，检查任务列表后可直接重试。整图现会加密保存在服务端，原文/尝试可能包含卡面其他内容；不新增安全码字段或导出列，仍拒绝检测到的明确CVV等文本，但不承诺通用安全码检测。 单批1–100文件、单文件50MB、总计500MB，MB按1024×1024字节计算，包含上限，超限返回FILE_TOO_LARGE/413，拒绝整批且不创建部分任务。一文件一Task；同批重复内容复用任务。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              - doc_type_hint
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                    description: 非空文件，最多50MB（50×1024×1024字节）；整批文件内容最多500MB。
                doc_type_hint:
                  $ref: '#/components/schemas/DocTypeEnum'
                abnormal_only:
                  type: boolean
                  default: false
                  description: 仅对 MEDICAL_REPORT 生效；完整抽取后投影异常/未知项，不减少原始结果或 stats
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  task_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

