name: Verify Agent Notes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify note tree, format + metadata, archive seals, module docs, agent index sync
        env:
          # HEAD is a no-op on a clean checkout. Compare against the pre-change
          # commit: PR base, or the previous tip of the pushed branch.
          # A new-branch push sends before=0000…; git show fails and the script
          # skips append-only (seal-vs-disk still runs).
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npx tsx scripts/verify-agent-note-tree.ts
          npx tsx scripts/verify-agent-note-format.ts
          npx tsx scripts/verify-archived-agent-notes.ts
          npx tsx scripts/verify-module-docs.ts
          # Agent 资产索引必须与笔记库同步：笔记变更后未重建 .agents/index.json 即红
          # （注意必须经 notes.ts 调度；agent-index.ts 是纯库，直跑是无输出的假绿）
          npx tsx scripts/notes.ts index --check
